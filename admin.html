<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>لوحة الإدارة</title>

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/admin-dark.css?v=1">
<link rel="stylesheet" href="css/logout-modal.css">
<link rel="stylesheet" href="css/app-notifications.css?v=2">

<style>
/* تنسيق نافذة إضافة وتعديل المعلم */
#employeeModal .modal-card {
    width: min(560px, calc(100% - 24px));
    max-height: 90vh;
    overflow-y: auto;
}

#employeeModal .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

#employeeModal .form-group {
    min-width: 0;
}

#employeeModal .form-group label {
    display: block;
    margin-bottom: 8px;
}

#employeeModal .form-group input,
#employeeModal .form-group select {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    font-family: inherit;
}

#employeeModal .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 24px;
}

@media (max-width: 480px) {
    #employeeModal .form-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }
}
</style>
<style>
.admin-report-tree{display:grid;gap:14px;margin-top:18px}
.admin-stage-group,.admin-department-group,.admin-employee-group{border:1px solid #dbe5ef;border-radius:14px;background:#fff;overflow:hidden}
.admin-stage-group>summary,.admin-department-group>summary,.admin-employee-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800}
.admin-stage-group>summary::-webkit-details-marker,.admin-department-group>summary::-webkit-details-marker,.admin-employee-group>summary::-webkit-details-marker{display:none}
.admin-stage-group>summary{background:#eaf2fb;color:#173d63;font-size:17px}
.admin-department-group>summary{background:#f3f7fb;color:#234b70}
.admin-employee-group>summary{background:#fff;color:#263d55;flex-wrap:wrap}
.admin-stage-group summary span,.admin-department-group summary span,.admin-employee-group summary span{margin-inline-start:auto;background:#eaf2fb;border-radius:20px;padding:4px 9px;font-size:12px}
.admin-employee-group summary small{width:100%;padding-inline-start:28px;color:#64748b;font-weight:600}
.admin-stage-content{padding:12px;display:grid;gap:12px}
.admin-department-content{padding:10px;display:grid;gap:9px}
.admin-employee-reports{padding:10px;display:grid;gap:8px;background:#f8fafc}
.admin-report-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:12px}
.admin-report-row>div{display:grid;gap:5px;flex:1;min-width:180px}
.admin-report-row small{color:#64748b}
.admin-report-row .view-btn{white-space:nowrap}
@media(max-width:600px){.admin-stage-content{padding:7px}.admin-department-content{padding:6px}.admin-report-row{align-items:flex-start}.admin-employee-group summary small{padding-inline-start:0}}
</style>
</head>

<body>

<div class="dashboard">

    <header class="header">
        <div class="header-right">
            <img src="assets/Logo.png" class="logo" alt="Logo">
            <div>
                <h2>نظام التقارير الأسبوعية</h2>
                <span>لوحة المدير العام</span>
            </div>
        </div>

        <div class="header-left">
            <div id="currentTime">00:00</div>
            <div id="currentDate">00/00/0000</div>

            <button id="homeBtn" type="button" aria-label="الرئيسية" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </button>

            <button id="themeBtn" type="button" aria-label="تفعيل الوضع الداكن" title="الوضع الداكن">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button id="logoutBtn" type="button" aria-label="تسجيل الخروج" title="تسجيل الخروج">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <section class="menu">
        <button class="menu-card" data-page="reports">
            <i class="fa-solid fa-file-pdf"></i>
            <span>التقارير</span>
        </button>

        <button class="menu-card" data-page="employees">
            <i class="fa-solid fa-users"></i>
            <span>الموظفون</span>
        </button>

        <button class="menu-card" data-page="settings">
            <i class="fa-solid fa-gear"></i>
            <span>الإعدادات</span>
        </button>

    </section>

    <main id="content"></main>

</div>

<!-- نافذة عرض التقرير -->
<div class="pdf-modal" id="pdfModal" aria-hidden="true">
    <div class="pdf-modal-card">
        <div class="pdf-modal-header">
            <div>
                <strong id="pdfModalTitle">عرض التقرير</strong>
                <span>التقرير الأسبوعي</span>
            </div>

            <button type="button" class="pdf-close" id="pdfClose" aria-label="إغلاق">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <iframe id="pdfFrame" title="عرض التقرير" src="about:blank"></iframe>
    </div>
</div>

<!-- نافذة إضافة وتعديل المعلم -->
<div class="modal" id="employeeModal" aria-hidden="true">
    <div class="modal-card">

        <h2 class="modal-title">إضافة معلم</h2>

        <div class="form-grid">

            <!-- اسم المعلم -->
            <div class="form-group">
                <label for="empName">اسم المعلم</label>
                <input
                    id="empName"
                    name="name"
                    type="text"
                    autocomplete="name"
                    placeholder="أدخل اسم المعلم"
                    required
                >
            </div>

            <!-- المرحلة -->
            <div class="form-group">
                <label for="empStage">المرحلة</label>
                <select id="empStage" name="stage" required>
                    <option value="">اختر المرحلة</option>
                    <option value="رياض الأطفال">رياض الأطفال</option>
                    <option value="الابتدائية">الابتدائية</option>
                    <option value="المتوسطة">المتوسطة</option>
                    <option value="الثانوية">الثانوية</option>
                    <option value="الإدارة">الإدارة</option>
                </select>
            </div>

            <!-- القسم -->
            <div class="form-group">
                <label for="empDepartment">القسم</label>
                <select id="empDepartment" name="department" required>
                    <option value="">اختر القسم</option>
                    <option value="اللغة العربية">اللغة العربية</option>
                    <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
                    <option value="الرياضيات">الرياضيات</option>
                    <option value="العلوم">العلوم</option>
                    <option value="الدراسات الإسلامية">الدراسات الإسلامية</option>
                    <option value="الدراسات الاجتماعية">الدراسات الاجتماعية</option>
                    <option value="الحاسب الآلي">الحاسب الآلي</option>
                    <option value="التربية البدنية">التربية البدنية</option>
                    <option value="التربية الفنية">التربية الفنية</option>
                    <option value="التربية الأسرية">التربية الأسرية</option>
                    <option value="الصفوف الأولية">الصفوف الأولية</option>
                    <option value="الإرشاد الطلابي">الإرشاد الطلابي</option>
                    <option value="شؤون الطلاب">شؤون الطلاب</option>
                    <option value="الإدارة المدرسية">الإدارة المدرسية</option>
                </select>
            </div>

            <!-- اسم المستخدم -->
            <div class="form-group">
                <label for="empUsername">اسم المستخدم</label>
                <input
                    id="empUsername"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="أدخل اسم المستخدم"
                    required
                >
            </div>

            <!-- الرقم السري -->
            <div class="form-group">
                <label for="empPassword">الرقم السري</label>
                <input
                    id="empPassword"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="أدخل الرقم السري"
                    required
                >
            </div>

        </div>

        <div class="modal-actions">
            <button class="save-btn" id="saveEmployee" type="button">
                حفظ المعلم
            </button>

            <button class="cancel-btn" id="closeModal" type="button">
                إلغاء
            </button>
        </div>

    </div>
</div>

<!-- ملفات النظام الأصلية -->
<script src="js/config.js?v=2"></script>

<script src="js/api.js?v=3"></script>
<script src="js/admin.js?v=9"></script>
<script src="js/app-notifications.js?v=2"></script>
<script src="js/admin-settings.js?v=2"></script>
<script src="js/logout-modal.js?v=2"></script>
<script src="js/theme.js?v=1"></script>

<script>
document.getElementById('homeBtn')?.addEventListener('click', function () {
    document.querySelectorAll('.menu-card').forEach(function (x) {
        x.classList.remove('active');
    });

    const card = document.querySelector('.menu-card[data-page="dashboard"]');
    card?.classList.add('active');

    if (typeof loadPage === 'function') {
        loadPage('dashboard');
    }
});
</script>

</body>
</html>
